version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartbuy
    ports:
      - '5432:5432'
    volumes:
      - smartbuy_pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/smartbuy
      AUTH_SECRET: dev-secret-change-in-production
      AUTH_URL: http://localhost:3000
      USE_MOCK_PROVIDERS: 'true'
    depends_on:
      - db

volumes:
  smartbuy_pgdata:
